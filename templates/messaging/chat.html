<!-- templates/messaging/chat.html -->

{% extends "base.html" %}

{% block content %}

<div class="container py-4">

<!-- Header -->
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">
        Chat about: <strong>{{ conversation.property.title }}</strong>
    </h5>
</div>

<!-- Chat Box -->
<div id="chat-box"
     class="border rounded p-3 mb-3 bg-white"
     style="height: 420px; overflow-y: auto;">

    {% for msg in messages %}
    <div class="mb-2 {% if msg.sender == request.user %}text-end{% endif %}">
        <div class="d-inline-block px-3 py-2 rounded
            {% if msg.sender == request.user %}
                bg-dark text-white
            {% else %}
                bg-light
            {% endif %}
        ">
            {{ msg.content }}
        </div>
    </div>
    {% endfor %}

</div>

<!-- Message Input -->
<form id="chat-form">
    {% csrf_token %}
    <div class="input-group">
        <input type="text"
               id="message-input"
               class="form-control"
               placeholder="Type a message..."
               autocomplete="off"
               required>
        <button class="btn btn-dark">Send</button>
    </div>
</form>
</div>

<script>
const chatBox = document.getElementById("chat-box");
const input = document.getElementById("message-input");
const form = document.getElementById("chat-form");

const conversationId = "{{ conversation.id }}";

const socket = new WebSocket(
    `ws://${window.location.host}/ws/chat/${conversationId}/`
);

// RECEIVE
socket.onmessage = function(e) {
    const data = JSON.parse(e.data);

    const isMe = data.sender_id == {{ request.user.id }};

    const div = document.createElement("div");
    div.className = "mb-2 " + (isMe ? "text-end" : "");

    div.innerHTML = `
        <div class="d-inline-block px-3 py-2 rounded
            ${isMe ? 'bg-dark text-white' : 'bg-light'}">
            ${data.message}
        </div>
    `;

    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
};

// SEND
form.addEventListener("submit", function(e) {
    e.preventDefault();

    const msg = input.value.trim();
    if (!msg) return;

    socket.send(JSON.stringify({ message: msg }));

    input.value = "";
});
</script>

{% endblock %}
